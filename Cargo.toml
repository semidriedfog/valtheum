[package]
name = "vault"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
futures-core = "0.3"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime_guess = "2.0"
base64 = "0.22"
anyhow = "1.0"
wry = "0.47"
tao = "0.30"
rfd = "0.15"
zip = "2.2"
tar = { version = "0.4.46", default-features = false }
zstd = "0.13"
rust-embed = "8.5"

getrandom = "0.3"
zeroize = "1.9"
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rpassword = "7"

[build-dependencies]
embed-resource = "3.0.11"

[[bin]]
name = "valtheum-restore"
path = "src/bin/valtheum-restore.rs"
