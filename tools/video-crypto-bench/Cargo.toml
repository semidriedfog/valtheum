[package]
name = "video-crypto-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
anyhow = "1"
argon2 = "0.5"
getrandom = "0.3"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1.9"
